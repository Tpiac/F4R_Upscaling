[Settings]
; Settings marked with (*) apply in-game instantly without restarting.
; (*) Applies to DLSS & FSR3 only. For XeSS, only fAnisotropicMipBias works in realtime.

; FSR3 - Nvidia & AMD GPU, DLSS - RTX Only, XeSS - Intel & any GPU
; 1 - FSR3, 2 - DLSS, 3 - XeSS, 0 - Off
iMethod=1

; (*) RCAS sharpness - 0.0 = no sharpening, 1.0 = max
fSharpness=0.5

; (*) NVIDIA Reflex to reduce game latency (DLSS mode only)
bEnableReflex=0
bReflexBoost=0

; (*) 0 = Native (default), 1 = Quality (0.66x, 1.5x), 2 = Balanced (0.58x, 1.7x), 3 = Performance (0.5x, 2x)
; ENB forces Native
iQualityMode=0

[Advanced]
; (*) Reflex FPS limiter (DLSS mode only)
bReflexUseFPSLimit=0
fReflexFPSLimit=60

; (*) -0.0001 = default safety net to preserve samplers from being overridden
; 0.0 = allows other mods to override samplers (ranging from -2.0 to 0.0)
; Custom values apply in Native mode only
fAnisotropicMipBias=-0.0001

[ENB]
; ENB D3D11 proxy bypass offsets (FSR3 & XeSS)
DeviceOffset=0x28
ContextOffset=0x6C20

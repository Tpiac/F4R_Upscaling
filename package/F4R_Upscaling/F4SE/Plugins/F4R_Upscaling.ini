[Settings]

; Settings apply in-game without restarting
; XeSS does not support changing iMethod & iQualityMode at runtime
; FSR3 - Nvidia & AMD GPU, DLSS - RTX Only, XeSS - Intel & any GPU
; 1 - FSR3, 2 - DLSS, 3 - XeSS, 0 - Off
iMethod=1

; 0 = Native, 1 = Quality, 2 = Balanced, 3 = Performance
; ENB forces Native
iQualityMode=0

; RCAS sharpness - 0.0 = no sharpening, 1.0 = max
fSharpness=0.5

; NVIDIA Reflex to reduce game latency
bEnableReflex=0
bReflexBoost=0
bReflexUseFPSLimit=0
fReflexFPSLimit=60

; Quality mode resolution scales
; Ranging from 0.60 to 0.67
fQualityScale=0.65

; Ranging from 0.55 to 0.62
fBalancedScale=0.59

; Ranging from 0.50 to 0.55
fPerformanceScale=0.5

; -0.0001 = default safety net to preserve samplers from being overridden
; 0.0 = allows other mods to override samplers (ranging from -2.0 to 0.0)
; Custom values apply in Native mode only
fAnisotropicMipBias=-0.0001

[Settings]
; RCAS sharpness - 0.0 = no sharpening, 1.0 = max
; Tweaking this setting applies in-game without restarting
fSharpness=0.5
; NVIDIA Reflex to reduce game latency
; Tweaking this settings applies in-game without restarting
bEnableReflex=0
bReflexBoost=0
; 0 = Native (DLAA, default), 1 = Quality DLSS (0.66x, 1.5x), 2 = Balanced (0.58x, 1.7x), 3 = Performance (0.5x, 2x)
; ENB forces Native
; Tweaking this setting applies in-game without restarting
iQualityMode=0

[Advanced]
; Reflex FPS limiter
; Tweaking this settings applies in-game without restarting
bReflexUseFPSLimit=0
fReflexFPSLimit=60
; -0.0001 = default safety net to preserve samplers from being overriden
;  0.0    = allowing other mods to override samplers
fAnisotropicMipBias=-0.0001

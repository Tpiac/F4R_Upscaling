[Settings]
; Settings marked with (*) apply in-game without restarting.

; RCAS sharpness - 0.0 = no sharpening, 1.0 = max
fSharpness=0.5

; 0 = Native (XeSS 1.0x, default), 1 = Quality (0.66x, 1.5x), 2 = Balanced (0.58x, 1.7x), 3 = Performance (0.5x, 2x)
; ENB forces Native
iQualityMode=0

[Advanced]
; (*) -0.0001 = default safety net to preserve samplers from being overridden
; 0.0 = allows other mods to override samplers (ranging from -2.0 to 0.0)
; Custom values apply in Native mode only
fAnisotropicMipBias=-0.0001

[ENB]
; ENB D3D11 proxy bypass offsets
DeviceOffset=0x28
ContextOffset=0x6C20
